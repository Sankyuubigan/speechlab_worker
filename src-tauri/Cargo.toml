[package]
name = "speechlab"
version = "0.1.0"
description = "ASR GUI for gigaam OGG files"
authors = ["you"]
edition = "2021"

[lib]
name = "speechlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Audio
symphonia = { version = "0.6", features = ["ogg", "vorbis", "wav", "pcm", "flac", "mp3"] }
anyhow = "1"
opus = "0.3"
ogg = "0.9"

# ONNX inference
ort = "2.0.0-rc.12"
ndarray = "0.17"

# CrispASR engine (TTS/STT) как отдельный prebuilt-процесс + HTTP — см. tauri-plugin-speech
tauri-plugin-speech = { path = "../../my-tauri-plugins/tauri-plugin-speech" }

# STT: system-wide voice input (push-to-talk)
rdev = "0.5"                               # global hotkey listener
cpal = "0.15"                              # microphone capture
tungstenite = { version = "0.24", features = ["native-tls"] }  # WebSocket to CrispASR
tray-icon = "0.19"                         # system tray icon
muda = "0.15"                              # tray menu
arboard = "3"                              # clipboard (cross-platform, Unicode-safe)
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }

# Логи: локальное время в метках таймингов (core rules §2.5.1)
chrono = "0.4"

# Профиль release — единый источник правды (rules.md §2. ЗАПРЕЩЕНО дублировать
# через CARGO_PROFILE_RELEASE_* в .bat-скриптах).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
