[package]
name = "speechlab"
version = "0.1.0"
description = "ASR GUI for gigaam OGG files"
authors = ["you"]
edition = "2021"

[lib]
name = "speechlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Audio
symphonia = { version = "0.6", features = ["ogg", "vorbis", "wav", "pcm", "flac", "mp3"] }
hound = "3"
anyhow = "1"
opus = "0.3"
ogg = "0.9"

# ONNX inference
ort = "2.0.0-rc.12"
ndarray = "0.17"

# CrispASR TTS engine (HTTP client only; engine runs as separate prebuilt subprocess)
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
zip = "2"
